    <rect x="135" y="92" width="930" height="516" rx="34" fill="#fff"/>
    <path d="M169 92h862a34 34 0 0 1 34 34v46H135v-46a34 34 0 0 1 34-34z" fill="#f1f3fb"/>
    <circle cx="180" cy="132" r="9" fill="#ff6b6b"/><circle cx="211" cy="132" r="9" fill="#ffd166"/><circle cx="242" cy="132" r="9" fill="#16c7bd"/>
    <rect x="846" y="118" width="164" height="28" rx="14" fill="#e5e8f5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">
      <text x="205" y="230" fill="#5b5cff">&lt;DigitalPulse /&gt;</text>
      <text x="205" y="278" fill="#151c36">const stack = {</text>
      <text x="250" y="326" fill="#169f98">backend:</text><text x="430" y="326" fill="#667085">[PHP, MySQL],</text>
      <text x="250" y="374" fill="#169f98">api:</text><text x="430" y="374" fill="#667085">[REST, JSON],</text>
      <text x="250" y="422" fill="#169f98">frontend:</text><text x="430" y="422" fill="#667085">[ReactJS, JavaScript],</text>
      <text x="250" y="470" fill="#169f98">design:</text><text x="430" y="470" fill="#667085">[SCSS, Figma],</text>
      <text x="205" y="518" fill="#151c36">};</text>
    </g>
    <rect x="205" y="550" width="490" height="14" rx="7" fill="#edf0f7"/><rect x="205" y="550" width="315" height="14" rx="7" fill="url(#accent)"/>
    <g transform="translate(760 222)">
      <rect width="240" height="250" rx="28" fill="#f7f8fd" stroke="#e6e9f4"/>
      <circle cx="120" cy="76" r="46" fill="#eef0ff"/><path d="M101 78l15 15 28-35" fill="none" stroke="#5b5cff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
