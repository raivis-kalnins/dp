    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#5b5cff"/><stop offset=".52" stop-color="#16c7bd"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1028" flood-opacity=".2"/></filter>
  </defs>
  <rect x="20" y="20" width="1160" height="660" rx="54" fill="url(#bg)"/>
  <g opacity=".08" stroke="#fff"><path d="M20 155h1160M20 290h1160M20 425h1160M20 560h1160M250 20v660M480 20v660M710 20v660M940 20v660"/></g>
  <circle cx="1090" cy="105" r="98" fill="#16c7bd" opacity=".09"/><circle cx="108" cy="585" r="128" fill="#5b5cff" opacity=".12"/>
