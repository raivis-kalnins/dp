      <text x="120" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#667085">Design · Code · API</text>
      <text x="120" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#667085">AI · Deploy · Support</text>
