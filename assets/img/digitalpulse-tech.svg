<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DigitalPulse web development technology stack</title>
  <desc id="desc">Stylised code editor showing PHP, MySQL, REST, JSON, React, JavaScript, SCSS and Figma technologies.</desc>
  <defs>
